<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | ClubCreate</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script defer src="login.js"></script>
</head>
<body class="page-shell">
<nav class="navbar navbar-inverse navbar-fixed-top site-nav">
    <div class="page-container">
        <div class="navbar-header">
            <a class="navbar-brand" href="index.html">ClubCreate</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="index.html">Home</a></li>
            <li><a href="userlogin.html">User Login</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </div>
</nav>

<main class="page-container">
    <section class="hero">
        <div>
            <p class="hero-eyebrow">Admin Access</p>
            <h1>ClubCreate</h1>
            <p class="lead-copy">!ADMINSTRATORS ONLY!</p>

            <div class="summary-card">
                <h3>Admin Login</h3>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                            id="email"
                            type="email"
                            class="form-control"
                            placeholder="Enter email"
                            autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                            id="password"
                            type="password"
                            class="form-control"
                            placeholder="Enter password"
                            autocomplete="current-password">
                </div>
                <button id="loginButton" class="btn btn-accent" type="button">
                    <i class="fa fa-lock"></i>
                    Login
                </button>
                <p id="message" class="message-line"></p>
            </div>
        </div>

        <div class="summary-card">
            <h3>Protected</h3>
            <ul class="story-list">
                <li>Please do not tamper with this website</li>
                <li>Protected With authentication.</li>
                <li>RLS.</li>
            </ul>
        </div>
    </section>
</main>

<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker
            .register("service-worker.js", { updateViaCache: "none" })
            .then(registration => registration.update())
            .catch(() => {});
    }
</script>
</body>
</html>
