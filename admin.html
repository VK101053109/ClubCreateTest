<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClubCreate Admin Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script defer src="admin.js"></script>
</head>
<body class="page-shell">
<nav class="navbar navbar-inverse navbar-fixed-top site-nav">
    <div class="page-container">
        <div class="navbar-header">
            <a class="navbar-brand" href="index.html">ClubCreate</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="index.html">Home</a></li>
            <li><a href="application.html">Applications</a></li>
            <li><a href="userlogin.html">User Login</a></li>
            <li><a href="#" id="logoutButton">Logout</a></li>
        </ul>
    </div>
</nav>

<main class="page-container">
    <section class="section">
        <div class="section-heading">
            <p class="section-kicker">ADMIN PANEL</p>
            <h1 class="section-title">Manage Applications</h1>
        </div>

        <div class="admin-stats">
            <div class="admin-stat">
                <strong id="totalApplications">0</strong>
                <span>All Applications</span>
            </div>
            <div class="admin-stat">
                <strong id="pendingApplications">0</strong>
                <span>Pending Review</span>
            </div>
            <div class="admin-stat">
                <strong id="approvedApplications">0</strong>
                <span>Approved</span>
            </div>
        </div>

        <div class="hero-actions">
            <button id="refreshApplicationsButton" class="btn btn-outline-accent">
                <i class="fa fa-refresh"></i>
                Refresh
            </button>
            <button id="clearApplicationsButton" class="btn btn-outline-accent">
                <i class="fa fa-trash"></i>
                Clear All
            </button>
        </div>

        <div class="admin-controls">
            <input
                    id="applicationSearch"
                    class="form-control"
                    type="search"
                    placeholder="Search applications...">
        </div>

        <div class="admin-meta">
            <div id="databaseStatus" class="admin-meta-item">Checking Database...</div>
            <div id="visibleCount" class="admin-meta-item">Showing 0 Applications</div>
        </div>

        <div id="adminApplicationsList" class="applications-board">
            <div class="empty-state">Loading Applications...</div>
        </div>
    </section>

    <div class="footer-band">
        <strong>ClubCreate</strong>
        Admin Dashboard
    </div>
</main>

<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker
            .register("service-worker.js", { updateViaCache: "none" })
            .then(registration => registration.update())
            .catch(() => {});
    }
</script>
</body>
</html>
