<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login | ClubCreate</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script defer src="userlogin.js"></script>
</head>
<body class="page-shell">
<nav class="navbar navbar-inverse navbar-fixed-top site-nav">
    <div class="page-container">
        <div class="navbar-header">
            <a class="navbar-brand" href="index.html">ClubCreate</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="application.html">Apply</a></li>
            <li><a href="userlogin.html">User Login</a></li>
            <li><a href="login.html">Admin</a></li>
        </ul>
    </div>
</nav>

<main class="page-container">
    <section class="hero">
        <div>
            <p class="hero-eyebrow">User Account</p>
            <h1>Login to ClubCreate</h1>
            <p class="lead-copy">Sign in to submit and manage your club applications.</p>

            <div class="summary-card">
                <div class="form-group">
                    <label>Email</label>
                    <input id="email" class="form-control" type="email" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="password" class="form-control" type="password" placeholder="Enter password">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input id="username" class="form-control" type="text" placeholder="Only needed when creating an account">
                </div>
                <button id="loginButton" class="btn btn-accent" type="button">
                    <i class="fa fa-sign-in"></i>
                    Login
                </button>
                <button id="signupButton" class="btn btn-outline-accent" type="button">
                    Create Account
                </button>
                <p id="message" class="message-line"></p>
            </div>
        </div>

        <div class="summary-card">
            <h3>User Access</h3>
            <ul class="story-list">
                <li>Save your login.</li>
                <li>View submitted applications.</li>
                <li>Submit new club ideas anytime.</li>
            </ul>
        </div>
    </section>
</main>

<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker
            .register("service-worker.js", { updateViaCache: "none" })
            .then(registration => registration.update())
            .catch(() => {});
    }
</script>
</body>
</html>
