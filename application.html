<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apply for a Club | ClubCreate</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script defer src="application.js"></script>
</head>
<body class="page-shell">
<nav class="navbar navbar-inverse navbar-fixed-top site-nav">
    <div class="page-container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#mynavbar">
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="index.html">ClubCreate</a>
        </div>
        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="nav navbar-nav navbar-right">
                <li><a href="index.html">Home</a></li>
                <li><a href="application.html">Apply</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="userlogin.html">User Login</a></li>
                <li><a href="login.html">Admin</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="page-container">
    <section class="hero">
        <div>
            <h3>Application</h3>
            <p class="hero-eyebrow">All yours</p>
            <div id="formMessage" class="message-line"></div>
        </div>
    </section>

    <section class="form-shell">
        <div class="form-card">
            <div class="section-heading">
                <p class="section-kicker">Club Request</p>
                <h2 class="section-title">Tell Us all About Your Club</h2>
                <p class="section-copy">Fill out the details thoroughly.</p>
            </div>

            <form id="applicationForm">
                <div class="form-grid">
                    <div class="form-group" style="grid-column:1/-1;">
                        <label for="proposed_name">Club Name</label>
                        <input id="proposed_name" class="form-control" type="text" placeholder="Enter your club name">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="leader">Select Club Leader</label>
                        <select id="leader">
                            <option value="none">Select</option>
                            <option value="You">You</option>
                            <option value="You do not have a leader">You do not have a leader</option>
                            <option value="You know of someone who can be leader">You know of someone who can be leader</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column:1/-1;">
                        <label for="proposed_description">Club Idea</label>
                        <textarea id="proposed_description" placeholder="Describe your club idea"></textarea>
                    </div>
                </div>
                <div class="hero-actions">
                    <button class="btn btn-accent" type="submit">Submit Application</button>
                </div>
            </form>
        </div>
    </section>

    <div class="footer-band">
        <strong>ClubCreate</strong> will let you know within 3-5 business days whether your application was accepted or not.
    </div>
</main>

<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker
            .register("service-worker.js", { updateViaCache: "none" })
            .then(registration => registration.update())
            .catch(() => {});
    }
</script>
</body>
</html>
